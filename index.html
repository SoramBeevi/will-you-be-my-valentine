<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will you be my Valentine My Love❤️</title>
  <style>
    :root{
      --bg-pink:#ffe6ec;
      --card:#fff;
      --accent:#ff4d6d;
      --muted:#6b5b6e;
      --shadow: 0 18px 40px rgba(0,0,0,.12);
    }

    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;background:var(--bg-pink)}
    /* center page content */
    body{display:flex;align-items:center;justify-content:center;padding:24px}

    /* card */
    .card{
      width:min(760px,96vw);
      max-width:840px;
      background:linear-gradient(180deg,#fff 0%, #fff4fa 100%);
      border-radius:16px;
      padding:32px;
      box-shadow:var(--shadow);
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
      text-align:center;
    }

    h1{margin:0;font-size:1.5rem;color:#7b1530}
    p.lead{margin:0;color:var(--muted)}

    /* floating hearts background */
    .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
    .heart{
      position:absolute;
      width:28px;height:28px;
      transform:rotate(45deg);
      background:var(--accent);
      opacity:.9;
      border-radius:2px;
    }
    .heart:before,.heart:after{content:"";position:absolute;width:100%;height:100%;background:inherit;border-radius:50%}
    .heart:before{top:-50%}
    .heart:after{left:-50%}
    @keyframes floatUp{0%{transform:translateY(0) rotate(45deg) scale(1);opacity:1}100%{transform:translateY(-120vh) rotate(45deg) scale(.6);opacity:0}}

    /* question area centered */
    .question-box{
      display:flex;
      flex-direction:column;
      gap:18px;
      align-items:center;
      width:100%;
      max-width:640px;
    }

    .buttons{display:flex;gap:16px;align-items:center;justify-content:center}
    button.btn{
      padding:12px 20px;
      border-radius:999px;
      border:0;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(0,0,0,.06);
      font-size:1rem;
    }
    button.yes{background:linear-gradient(90deg,#ff6b88,#ff2d6f);color:#fff}
    button.no{background:linear-gradient(90deg,#7fb3ff,#3b8cff);color:#fff}

    /* modal */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;opacity:0;pointer-events:none;transition:opacity .15s}
    .modal.show{opacity:1;pointer-events:auto}
    .popup{background:white;padding:22px;border-radius:12px;max-width:92vw;text-align:center}
    .big-heart{font-size:4.4rem;margin-bottom:6px}
    .close{margin-top:12px;padding:8px 12px;border-radius:8px;border:0;background:#eee;cursor:pointer}

    @media (max-width:520px){
      .card{padding:20px}
      .big-heart{font-size:3.4rem}
      button.btn{padding:10px 14px}
    }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <main class="card" role="main" aria-labelledby="qtitle">
    <h1 id="qtitle">Will you be my Valentine?</h1>
    <p class="lead">A tiny surprise — choose your Love answer below.</p>

    <div class="question-box" role="form" aria-label="Valentine question">
      <div class="buttons" id="buttons">
        <button class="btn yes" id="yesBtn" aria-pressed="false">Yes❤️</button>
        <!-- No button placed after yes in DOM but visually side-by-side.
             It will dodge on hover/focus/click and must not be clickable. -->
        <button class="btn no evasive" id="noBtn" aria-label="No (try to click me)">No💙</button>
      </div>
    </div>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="popup" id="popup">
      <div id="popup-content" aria-live="polite"></div>
      <button class="close" id="closePopup">Close</button>
    </div>
  </div>

  <script>
    // hearts background
    const heartsContainer = document.querySelector('.hearts');
    function spawnHeart(){
      const h = document.createElement('div');
      h.className = 'heart';
      const size = 12 + Math.random()*44;
      h.style.width = h.style.height = size + 'px';
      h.style.left = (Math.random()*100) + '%';
      h.style.top = (100 + Math.random()*30) + '%';
      const hue = 320 + Math.random()*40;
      h.style.background = `hsl(${hue},72%,66%)`;
      h.style.animation = `floatUp ${8 + Math.random()*7}s linear forwards`;
      heartsContainer.appendChild(h);
      setTimeout(()=> h.remove(), 20000);
    }
    for(let i=0;i<10;i++) setTimeout(spawnHeart, i*120);
    setInterval(spawnHeart, 420);

    // modal helpers
    const modal = document.getElementById('modal');
    const popupContent = document.getElementById('popup-content');
    const closePopup = document.getElementById('closePopup');
    function showPopup(html){
      popupContent.innerHTML = html;
      modal.classList.add('show');
      modal.setAttribute('aria-hidden','false');
      closePopup.focus();
    }
    function hidePopup(){
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden','true');
    }
    closePopup.addEventListener('click', hidePopup);
    modal.addEventListener('click', (e)=> { if(e.target === modal) hidePopup(); });
    document.addEventListener('keydown', (e)=> { if(e.key === 'Escape') hidePopup(); });

    // No button evasive behavior
    function makeEvasive(btn){
      const box = document.querySelector('.question-box');
      function move(){
        // compute a random position within the question-box bounds
        const rect = box.getBoundingClientRect();
        const bw = btn.offsetWidth, bh = btn.offsetHeight;
        const pad = 6;
        const maxX = Math.max(0, rect.width - bw - pad*2);
        const maxY = Math.max(0, rect.height - bh - pad*2);
        const x = Math.floor(Math.random()*maxX) + pad;
        const y = Math.floor(Math.random()*maxY) + pad;
        btn.style.position = 'relative';
        btn.style.left = x + 'px';
        btn.style.top = y + 'px';
      }
      // move on hover / focus / click / keyboard
      btn.addEventListener('mouseenter', move);
      btn.addEventListener('focus', move);
      btn.addEventListener('click', (e)=> { e.preventDefault(); move(); });
      btn.addEventListener('keydown', (e)=> { if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); move(); } });
    }
    makeEvasive(document.getElementById('noBtn'));

    // Yes button: show popup only once per page load
    const yesBtn = document.getElementById('yesBtn');
    let shown = false;
    yesBtn.addEventListener('click', (e)=>{
      e.preventDefault();
      if(shown) return;           // already shown once this load
      shown = true;
      // disable further interaction
      yesBtn.disabled = true;
      yesBtn.setAttribute('aria-pressed','true');
      yesBtn.style.opacity = '0.9';
      showPopup('<div class="big-heart">❤️</div><h3>Yay..!</h3><p>I know ❤️..!I will be your valentine — Love You So much Purusha👩🏻‍❤️‍👨🏻ummmaaaa😘😘😘</p>');
    });
  </script>
</body>
</html>
